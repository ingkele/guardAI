# guardAI AI 工具 hook（由 guardAI init 生成）
# PreToolUse：写之前拦「往哪写」（禁用目录/落位）+ 注入「能依赖谁」的层契约上下文。
# PostToolUse：写之后当轮拦「写了什么」（内容级层依赖），on_failure = "block" 不修完不放行。
[[hooks]]
event = "PreToolUse"
command = "{{GUARDAI_CMD}} gate --stdin"
timeout_ms = 10000
on_failure = "block"

[[hooks]]
event = "PostToolUse"
command = "{{GUARDAI_CMD}} check --repo . --mode changed --trigger hook"
timeout_ms = 30000
on_failure = "block"
