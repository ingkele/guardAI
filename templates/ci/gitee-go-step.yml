# guardAI 规范门禁步骤（由 guardAI init 生成）
# 用法：把下面这个 step 合并进 Gitee Go 现有构建 stage 的 steps 列表。
# 退出码非 0 流水线红灯（0=通过 / 1=违规 / 2=配置或环境错误）。
# 二进制来源：GitHub Release（自包含单文件，零运行时依赖，解压即用）。
# 国内网络提示：runner 拉 GitHub 不稳时，可先把 guardAI-linux-x64.zip 放到内部制品库/OSS，
#               把下面下载地址换成内部地址（或直接把解压好的 guardAI 放进构建镜像）。
# 提示：请把 .guard/duplicates-baseline.json 一并提交入库（只记重复对身份指纹，不含代码），
#       否则 CI 全新 runner 每次首跑收基线 = 重复检测假绿。
- name: 规范守卫
  goals: |
    curl -fsSL -o /tmp/guardai.zip https://github.com/ingkele/guardAI/releases/latest/download/guardAI-linux-x64.zip
    unzip -q /tmp/guardai.zip -d /tmp/guardai
    chmod +x /tmp/guardai/linux-x64/GuardAI.Cli
    /tmp/guardai/linux-x64/GuardAI.Cli check --repo . --mode all --trigger ci
